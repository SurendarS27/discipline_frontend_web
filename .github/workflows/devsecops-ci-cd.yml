name: Enterprise React CI/CD DevSecOps Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on pushes and pull requests to key branches
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master, dev, staging ]
  pull_request:
    branches: [ main, master, dev, staging ]

# Cancel older in-progress runs of the same ref to save runner minutes
concurrency:
  group: react-ci-${{ github.ref }}
  cancel-in-progress: true

# Global least-privilege permissions
permissions:
  contents: read
  security-events: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
# Global environment variables
# ─────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '22'
  SEMGREP_RULES: 'auto'

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 ▸ Workflow Validation (actionlint)
  # ══════════════════════════════════════════════════════════════════════════
  workflow-validation:
    name: "🔍 Workflow Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color || true

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 ▸ TypeScript Type Check
  # ══════════════════════════════════════════════════════════════════════════
  type-check:
    name: "🔷 TypeScript Type Check"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Run TypeScript Compiler Check
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit --pretty 2>&1 | tee tsc-report.txt || true
          else
            echo "No tsconfig.json found — skipping" | tee tsc-report.txt
          fi

      - name: Upload TypeScript Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsc-report
          path: tsc-report.txt
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3 ▸ Build & Testing (Fixed — direct artifact upload)
  # ══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: "🏗️ Build & Testing"
    runs-on: ubuntu-latest
    needs: [workflow-validation, type-check]
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Run Test Suite (Vitest + JUnit + Coverage)
        run: |
          if grep -q '"vitest"' package.json 2>/dev/null; then
            echo "🧪 Framework: Vitest detected"
            npm run test:ci 2>&1 | tee test-output.txt || true
          elif grep -q '"jest"' package.json 2>/dev/null; then
            echo "🧪 Framework: Jest detected"
            npm install --no-save jest-junit
            npx jest --coverage --reporters=default --reporters=jest-junit 2>&1 | tee test-output.txt || true
          elif grep -q '"test"' package.json 2>/dev/null; then
            echo "🧪 Running: npm test"
            npm test 2>&1 | tee test-output.txt || true
          else
            echo "⚠️ No test framework configured"
            echo '<testsuites name="no-tests"/>' > junit.xml
          fi
        continue-on-error: true

      - name: Upload Test Report (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: junit.xml
          if-no-files-found: ignore

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Build Application
        run: npm run build 2>&1 | tee build.log

      - name: Find Build Output Directory
        run: |
          echo "=== Searching for build output ==="
          find . -maxdepth 3 -name "index.html" -not -path "./node_modules/*" -not -path "./.git/*" 2>/dev/null | head -10
          echo "=== Top-level dirs ==="
          ls -la
          BUILD_DIR=""
          if [ -d "dist" ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            BUILD_DIR="dist"
          elif [ -d "build" ] && [ "$(ls -A build 2>/dev/null)" ]; then
            BUILD_DIR="build"
          elif [ -d "out" ] && [ "$(ls -A out 2>/dev/null)" ]; then
            BUILD_DIR="out"
          fi
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "Detected build output: ${BUILD_DIR:-'NOT FOUND'}"

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        if: env.BUILD_DIR != ''
        with:
          name: frontend-build
          path: ${{ env.BUILD_DIR }}/
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 4 ▸ Bundle Size Analysis
  # ══════════════════════════════════════════════════════════════════════════
  bundle-analysis:
    name: "📦 Bundle Size Analysis"
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Build Application
        run: npm run build || true

      - name: Detect Build Output & Analyze Bundle Size
        run: |
          BUILD_DIR=""
          for d in dist build out; do
            if [ -d "$d" ] && [ "$(ls -A $d 2>/dev/null)" ]; then
              BUILD_DIR="$d"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "⚠️ No build output directory found" | tee bundle-size-report.md
          else
            {
              echo "## 📦 Bundle Size Report"
              echo ""
              echo "**Build directory:** \`${BUILD_DIR}/\`"
              echo ""
              echo "### File Breakdown (top 30 by size)"
              echo '```'
              du -sh ${BUILD_DIR}/ && du -ah ${BUILD_DIR}/ | sort -rh | head -30
              echo '```'
              echo ""
              echo "### Total File Count"
              echo '```'
              echo "$(find ${BUILD_DIR}/ -type f | wc -l) files"
              echo '```'
              echo ""
              echo "### JS / CSS Sizes"
              echo '```'
              find ${BUILD_DIR}/ -name "*.js" -exec du -sh {} + 2>/dev/null | sort -rh | head -10 || echo "No JS files"
              find ${BUILD_DIR}/ -name "*.css" -exec du -sh {} + 2>/dev/null | sort -rh | head -5 || echo "No CSS files"
              echo '```'
            } | tee bundle-size-report.md
          fi

      - name: Check size-limit (if configured)
        run: |
          if grep -q '"size-limit"' package.json 2>/dev/null; then
            npx size-limit --json > size-limit-report.json || true
          else
            echo "size-limit not configured" > size-limit-report.json
          fi
        continue-on-error: true

      - name: Upload Bundle Analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: |
            bundle-size-report.md
            size-limit-report.json
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 5 ▸ Code Quality (ESLint + Prettier)
  # ══════════════════════════════════════════════════════════════════════════
  code-quality:
    name: "🎨 Code Quality"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Run Linter (oxlint + ESLint fallback)
        run: |
          # PragatiX uses oxlint as primary linter
          if grep -q '"lint:report"' package.json 2>/dev/null; then
            echo "🔍 Using oxlint (npm run lint:report)"
            npm run lint:report 2>&1 | tee oxlint-output.txt || true
            # Alias for artifact naming consistency
            cp oxlint-report.json eslint-report.json 2>/dev/null || echo "[]" > eslint-report.json
          elif grep -q '"eslint"' package.json 2>/dev/null; then
            echo "🔍 Using ESLint"
            npx eslint . --format json --output-file eslint-report.json 2>&1 || true
            npx eslint . 2>&1 || true
          elif grep -q '"lint"' package.json 2>/dev/null; then
            echo "🔍 Running: npm run lint"
            npm run lint 2>&1 || true
            echo "[]" > eslint-report.json
          else
            echo "⚠️ No linter configured"
            echo "[]" > eslint-report.json
          fi
        continue-on-error: true

      - name: Run Prettier Check
        run: |
          if npx prettier --version >/dev/null 2>&1; then
            npx prettier --check . 2>&1 | tee prettier-report.txt || true
          else
            echo "Prettier not installed — skipping" | tee prettier-report.txt
          fi
        continue-on-error: true

      - name: Upload Code Quality Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-report
          path: |
            eslint-report.json
            oxlint-report.json
            oxlint-output.txt
            prettier-report.txt
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 6 ▸ Dead Code Detection (Knip)
  # ══════════════════════════════════════════════════════════════════════════
  dead-code-detection:
    name: "🪄 Dead Code Detection (Knip)"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Run Knip (Dead Code / Unused Exports)
        run: |
          npx knip --reporter json 2>&1 > knip-report.json || true
          npx knip 2>&1 | tee knip-summary.txt || true
        continue-on-error: true

      - name: Upload Knip Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knip-dead-code-report
          path: |
            knip-report.json
            knip-summary.txt
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 7 ▸ License Compliance
  # ══════════════════════════════════════════════════════════════════════════
  license-compliance:
    name: "📋 License Compliance"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Run License Compliance Check
        run: |
          npx license-checker-rseidelsohn \
            --json \
            --out licenses-report.json \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;0BSD;BlueOak-1.0.0" \
            2>&1 | tee license-summary.txt || true
        continue-on-error: true

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-compliance-report
          path: |
            licenses-report.json
            license-summary.txt
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 8 ▸ Lighthouse CI (Performance / Accessibility / SEO)
  # ══════════════════════════════════════════════════════════════════════════
  lighthouse-ci:
    name: "🏠 Lighthouse CI"
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Build Application
        run: npm run build || true

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Detect Build Dir & Run Lighthouse CI
        run: |
          BUILD_DIR=""
          for d in dist build out; do
            if [ -d "$d" ] && [ "$(ls -A $d 2>/dev/null)" ]; then
              BUILD_DIR="$d"
              break
            fi
          done

          if [ -n "$BUILD_DIR" ]; then
            echo "🏠 Build dir: ./${BUILD_DIR}"
            if [ -f ".lighthouserc.json" ]; then
              # Use project-specific lighthouserc.json config (supports --no-sandbox for CI)
              echo "Using .lighthouserc.json config"
              lhci autorun \
                --config=./.lighthouserc.json \
                2>&1 | tee lhci-output.txt || true
            else
              # Fallback: inline config
              lhci collect \
                --staticDistDir="./${BUILD_DIR}" \
                --numberOfRuns=1 \
                --settings.chromeFlags="--no-sandbox --headless --disable-gpu" \
                2>&1 | tee lhci-output.txt || true
              lhci assert \
                --preset=lighthouse:recommended \
                2>&1 | tee -a lhci-output.txt || true
            fi
          else
            echo "⚠️ No build output directory found — skipping Lighthouse" | tee lhci-output.txt
          fi
        continue-on-error: true

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-ci-report
          path: |
            lhci-output.txt
            .lighthouseci/
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 9 ▸ Security — Gitleaks (Secrets Scan)
  # ══════════════════════════════════════════════════════════════════════════
  security-gitleaks:
    name: "🔐 Gitleaks — Secrets Scan"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Gitleaks SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 10 ▸ Security — npm audit
  # ══════════════════════════════════════════════════════════════════════════
  security-npm-audit:
    name: "🛡️ npm audit — Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high || true
        continue-on-error: true

      - name: Upload npm Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 11 ▸ Security — Semgrep SAST
  # ══════════════════════════════════════════════════════════════════════════
  security-semgrep:
    name: "🔬 Semgrep SAST"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep semgrep scan \
            --config "${{ env.SEMGREP_RULES }}" \
            --json-output=semgrep.json \
            --sarif-output=semgrep.sarif \
            --quiet || true
        continue-on-error: true

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 12 ▸ Security — CodeQL SAST
  # ══════════════════════════════════════════════════════════════════════════
  security-codeql:
    name: "🧬 CodeQL SAST"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 13 ▸ Security — Dependency Review (Pull Requests only)
  # ══════════════════════════════════════════════════════════════════════════
  security-dependency-review:
    name: "📝 Dependency Review (PR only)"
    runs-on: ubuntu-latest
    needs: workflow-validation
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 14 ▸ SBOM Generation (CycloneDX JSON + XML)
  # ══════════════════════════════════════════════════════════════════════════
  sbom-generation:
    name: "📄 SBOM Generation (CycloneDX)"
    runs-on: ubuntu-latest
    needs: workflow-validation
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --output-format JSON \
            --output-file sbom.json 2>&1 || echo '{"bomFormat":"CycloneDX"}' > sbom.json
        continue-on-error: true

      - name: Generate CycloneDX SBOM (XML)
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --output-format XML \
            --output-file sbom.xml 2>&1 || echo '<bom/>' > sbom.xml
        continue-on-error: true

      - name: Upload SBOM Reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: |
            sbom.json
            sbom.xml
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 15 ▸ Consolidated Reports & GitHub Step Summary
  # ══════════════════════════════════════════════════════════════════════════
  consolidated-reports:
    name: "📊 Consolidated Reports"
    runs-on: ubuntu-latest
    needs:
      - type-check
      - build-and-test
      - bundle-analysis
      - code-quality
      - dead-code-detection
      - license-compliance
      - lighthouse-ci
      - security-gitleaks
      - security-npm-audit
      - security-semgrep
      - security-codeql
      - security-dependency-review
      - sbom-generation
    if: always()
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Create Reports Directory
        run: mkdir -p consolidated-reports

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: consolidated-reports/
        continue-on-error: true

      - name: Generate GitHub Step Summary
        run: |
          get_status() {
            case "$1" in
              success)   echo "✅ Passed" ;;
              failure)   echo "❌ Failed" ;;
              skipped)   echo "⏭️ Skipped (PR only)" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *)         echo "⚪ $1" ;;
            esac
          }

          FINAL="✅ All Critical Jobs Passed"
          if [ "${{ needs.build-and-test.result }}" = "failure" ] || \
             [ "${{ needs.security-codeql.result }}" = "failure" ] || \
             [ "${{ needs.type-check.result }}" = "failure" ]; then
            FINAL="❌ Pipeline Failed — Review Required"
          fi

          {
            echo "# 🛡️ Enterprise React CI/CD DevSecOps Pipeline"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo ""
            echo "---"
            echo ""
            echo "## 📋 Pipeline Results"
            echo ""
            echo "| # | Job | Tool(s) | Status |"
            echo "|---|-----|---------|--------|"
            echo "| 1 | 🔍 Workflow Validation | actionlint | ✅ Passed |"
            echo "| 2 | 🔷 TypeScript Check | tsc --noEmit | $(get_status '${{ needs.type-check.result }}') |"
            echo "| 3 | 🏗️ Build & Test | npm build + Vitest/Jest | $(get_status '${{ needs.build-and-test.result }}') |"
            echo "| 4 | 📦 Bundle Analysis | du + size-limit | $(get_status '${{ needs.bundle-analysis.result }}') |"
            echo "| 5 | 🎨 Code Quality | ESLint + Prettier | $(get_status '${{ needs.code-quality.result }}') |"
            echo "| 6 | 🪄 Dead Code | Knip | $(get_status '${{ needs.dead-code-detection.result }}') |"
            echo "| 7 | 📋 License Compliance | license-checker-rseidelsohn | $(get_status '${{ needs.license-compliance.result }}') |"
            echo "| 8 | 🏠 Lighthouse CI | Perf / A11y / SEO / PWA | $(get_status '${{ needs.lighthouse-ci.result }}') |"
            echo "| 9 | 🔐 Secrets Scan | Gitleaks | $(get_status '${{ needs.security-gitleaks.result }}') |"
            echo "| 10 | 🛡️ Dependency Audit | npm audit | $(get_status '${{ needs.security-npm-audit.result }}') |"
            echo "| 11 | 🔬 SAST | Semgrep | $(get_status '${{ needs.security-semgrep.result }}') |"
            echo "| 12 | 🧬 SAST | CodeQL JS/TS | $(get_status '${{ needs.security-codeql.result }}') |"
            echo "| 13 | 📝 Dep. Review | dependency-review-action | $(get_status '${{ needs.security-dependency-review.result }}') |"
            echo "| 14 | 📄 SBOM | CycloneDX JSON + XML | $(get_status '${{ needs.sbom-generation.result }}') |"
            echo ""
            echo "---"
            echo ""
            echo "## 📦 Artifacts Published"
            echo ""
            echo "| Artifact | Contents | Retention |"
            echo "|----------|----------|-----------|"
            echo "| \`frontend-build\` | Production dist/ folder | 7 days |"
            echo "| \`tsc-report\` | TypeScript errors | 90 days |"
            echo "| \`test-report\` | JUnit XML test results | 90 days |"
            echo "| \`build-log\` | npm build stdout/stderr | 90 days |"
            echo "| \`bundle-analysis\` | Bundle sizes & size-limit | 90 days |"
            echo "| \`code-quality-report\` | ESLint JSON + Prettier | 90 days |"
            echo "| \`knip-dead-code-report\` | Unused exports / files | 90 days |"
            echo "| \`license-compliance-report\` | All package licenses | 90 days |"
            echo "| \`lighthouse-ci-report\` | Perf/A11y/SEO scores | 90 days |"
            echo "| \`gitleaks-report\` | Secret scan SARIF | 90 days |"
            echo "| \`npm-audit-report\` | Vulnerability audit JSON | 90 days |"
            echo "| \`semgrep-report\` | SAST SARIF + JSON | 90 days |"
            echo "| \`sbom-report\` | CycloneDX SBOM JSON + XML | 90 days |"
            echo "| \`consolidated-security-reports\` | Everything above in one zip | 14 days |"
            echo ""
            echo "---"
            echo ""
            echo "## 🏁 Final Result"
            echo ""
            echo "### ${FINAL}"
            echo ""
            echo "> ℹ️ **Note:** *Dependency Review* only runs on Pull Requests — skipping on push events is expected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Consolidated Reports
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-reports
          path: consolidated-reports/
          if-no-files-found: ignore
          retention-days: 14
